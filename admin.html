<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Área da Karen · Trustmore</title>

<style>
  :root {
    --navy-900: #071633;
    --navy-800: #0c2050;
    --navy-700: #12305c;
    --gold-600: #d99a2b;
    --gold-400: #fbd97a;
    --amber-500: #f59e0b;
    --ink: #1F2937;
    --grey: #6b7280;
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e8e6e1;
    --green: #1a9c5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 56px;
  }
  .brand-tag {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-400);
    margin-bottom: 6px;
  }
  h1 {
    text-align: center;
    color: #fff;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.75);
    font-size: 13.5px;
    margin: 0 0 26px;
    line-height: 1.5;
  }
  .status {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 13.5px;
    margin: 20px 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
  }
  .card-stars { color: var(--amber-500); font-size: 15px; letter-spacing: 1px; margin-bottom: 8px; }
  .card-text { font-size: 15px; line-height: 1.5; color: var(--ink); margin: 0 0 10px; }
  .card-meta { font-size: 12.5px; color: var(--grey); margin-bottom: 14px; }
  .card-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-approve {
    background: var(--green);
    color: #fff;
  }
  .card.done {
    opacity: 0.55;
  }
  .card-approved-tag {
    display: inline-block;
    background: rgba(26,156,92,0.12);
    color: var(--green);
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .empty-state {
    background: rgba(255,255,255,0.08);
    border: 1px dashed rgba(255,255,255,0.35);
    border-radius: 16px;
    padding: 26px 20px;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1.6;
  }
  .refresh-row {
    text-align: center;
    margin-top: 22px;
  }
  .btn-refresh {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin: 26px 0 12px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="brand-tag">Trustmore</div>
  <h1>Área da Karen</h1>
  <p class="subtitle">Aqui aparecem os comentários que os clientes deixaram.<br>Toque em <strong>Aprovar</strong> para publicar no seu link.</p>

  <div id="statusMsg" class="status">Carregando comentários…</div>
  <div id="pendingContainer"></div>

  <div class="refresh-row">
    <button class="btn-refresh" id="refreshBtn">↻ Atualizar lista</button>
  </div>
</div>

<script>
  // ------------------------------------------------------------------
  // CONFIGURAÇÃO
  // ------------------------------------------------------------------
  const CONFIG = {
    // CSV com TODOS os comentários recebidos (aba "Form Responses 1")
    allReviewsCsvUrl: "https://docs.google.com/spreadsheets/d/1_opJeaBCjehlQq77SL-L47XwVg4dgJrV9aBscMZpZ-M/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent("Form Responses 1"),

    // CSV com os comentários já aprovados (aba "Publicado")
    approvedCsvUrl: "https://docs.google.com/spreadsheets/d/1_opJeaBCjehlQq77SL-L47XwVg4dgJrV9aBscMZpZ-M/gviz/tq?tqx=out:csv&sheet=Publicado",

    // Formulário "Aprovações" — enviar o Timestamp aqui marca a avaliação como aprovada
    approveFormActionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSdHvoXZ3iOMwhGK2aDPD8PvENF7KIuzAEyP0FhJPqjb8D_8pg/formResponse",
    approveEntryId: "entry.1152514828",
  };

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (c === "\r") {
        // ignora
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ""));
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const statusMsg = document.getElementById("statusMsg");
  const pendingContainer = document.getElementById("pendingContainer");
  const refreshBtn = document.getElementById("refreshBtn");

  async function fetchCsvRows(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("Falha ao buscar dados (" + res.status + ")");
    const text = await res.text();
    return parseCSV(text);
  }

  function renderPending(items) {
    if (items.length === 0) {
      statusMsg.textContent = "";
      pendingContainer.innerHTML = `
        <div class="empty-state">
          Nenhum comentário pendente por aqui.<br>
          Quando um cliente preencher o formulário de avaliação, ele vai aparecer aqui para você aprovar.
        </div>`;
      return;
    }

    statusMsg.textContent = "";
    pendingContainer.innerHTML = items.map((item, idx) => {
      const rating = Math.min(5, Math.max(1, parseInt(item.nota, 10) || 5));
      return `
        <div class="card" data-idx="${idx}">
          <div class="card-stars">${"★".repeat(rating)}${"☆".repeat(5 - rating)}</div>
          <p class="card-text">"${escapeHtml(item.comentario)}"</p>
          <div class="card-meta">${escapeHtml(item.nome || "Cliente")}${item.data ? " · " + escapeHtml(item.data) : ""}</div>
          <div class="card-actions">
            <button class="btn btn-approve" data-timestamp="${escapeHtml(item.timestamp)}">✓ Aprovar e publicar</button>
          </div>
        </div>`;
    }).join("");

    pendingContainer.querySelectorAll(".btn-approve").forEach(btn => {
      btn.addEventListener("click", () => approveReview(btn));
    });
  }

  async function approveReview(btn) {
    const timestamp = btn.getAttribute("data-timestamp");
    btn.disabled = true;
    btn.textContent = "Aprovando…";

    try {
      const body = new URLSearchParams();
      body.set(CONFIG.approveEntryId, timestamp);
      await fetch(CONFIG.approveFormActionUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      });

      const card = btn.closest(".card");
      card.classList.add("done");
      card.querySelector(".card-actions").innerHTML =
        `<span class="card-approved-tag">✓ Aprovado — já está no seu link</span>`;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "✓ Aprovar e publicar";
      alert("Não foi possível aprovar agora. Verifique sua internet e tente de novo.");
    }
  }

  async function loadPending() {
    statusMsg.textContent = "Carregando comentários…";
    pendingContainer.innerHTML = "";

    try {
      const [allRows, approvedRows] = await Promise.all([
        fetchCsvRows(CONFIG.allReviewsCsvUrl),
        fetchCsvRows(CONFIG.approvedCsvUrl).catch(() => []),
      ]);

      if (allRows.length <= 1) {
        renderPending([]);
        return;
      }

      const header = allRows[0].map(h => h.trim().toLowerCase());
      const idxTimestamp = header.indexOf("timestamp");
      const idxNome = header.indexOf("seu nome");
      const idxNota = header.findIndex(h => h.startsWith("nota"));
      const idxComentario = header.indexOf("comentário");

      const approvedTimestamps = new Set(
        approvedRows.slice(1).map(r => (r[3] || "").trim()).filter(Boolean)
      );

      const all = allRows.slice(1).map(cols => ({
        timestamp: (cols[idxTimestamp] || "").trim(),
        nome: (cols[idxNome] || "").trim(),
        nota: (cols[idxNota] || "").trim(),
        comentario: (cols[idxComentario] || "").trim(),
        data: (cols[idxTimestamp] || "").trim(),
      })).filter(r => r.timestamp && r.comentario);

      const pending = all.filter(r => !approvedTimestamps.has(r.timestamp)).reverse();
      renderPending(pending);
    } catch (err) {
      statusMsg.textContent = "Não foi possível carregar os comentários agora. Toque em \"Atualizar lista\" para tentar de novo.";
      pendingContainer.innerHTML = "";
      console.warn(err);
    }
  }

  refreshBtn.addEventListener("click", loadPending);
  loadPending();
</script>

</body>
</html>
