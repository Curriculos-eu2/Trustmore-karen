<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karen Viana · Limpezas em geral · Trustmore</title>
<meta name="description" content="Portfólio de avaliações de Karen Viana — limpezas em geral em Amsterdam e cidades vizinhas. Página Trustmore.">
<meta name="theme-color" content="#011f59">

<!-- Open Graph: como o link aparece quando compartilhado no WhatsApp -->
<meta property="og:type" content="profile">
<meta property="og:title" content="Karen Viana · Limpezas em geral · Trustmore">
<meta property="og:description" content="Veja as avaliações de clientes de Karen Viana em Amsterdam e cidades vizinhas.">
<meta property="og:locale" content="pt_BR">

<style>
  :root {
    --navy-900: #071633;
    --navy-800: #0c2050;
    --navy-700: #12305c;
    --gold-600: #d99a2b;
    --gold-400: #fbd97a;
    --amber-500: #f59e0b;
    --ink: #1F2937;
    --grey: #6b7280;
    --grey-light: #9aa3af;
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e8e6e1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background-color: #011f59; /* cor de segurança enquanto a imagem carrega / caso não cubra tudo */
    background-image: url("fundo.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 56px;
  }
  .brand-tag {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fbd97a;
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    margin-bottom: 22px;
  }

  /* ---- Hero card ---- */
  /* "Vidro" translúcido na mesma cor do fundo, em vez de um bloco sólido de outra cor */
  .hero {
    background: linear-gradient(180deg, rgba(7,22,51,0.6) 0%, rgba(7,22,51,0.8) 100%);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(251,217,122,0.28);
    border-radius: 24px;
    padding: 32px 24px 28px;
    text-align: center;
    color: #fff;
    box-shadow: 0 14px 34px -14px rgba(1,10,30,0.65);
  }
  .avatar {
    width: 92px; height: 92px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(251,217,122,0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700;
    color: #fff;
  }
  .hero h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
  }
  .hero .service {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.92);
  }
  .hero .region {
    margin: 0 0 18px;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
  }
  .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .cta-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: #ffffff;
    color: var(--navy-800);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.45);
  }

  /* ---- Sections ---- */
  .section {
    margin-top: 30px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .review-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .review-stars { color: var(--amber-500); font-size: 14px; letter-spacing: 1px; margin-bottom: 6px; }
  .review-text { font-size: 14.5px; line-height: 1.5; color: var(--ink); margin: 0 0 8px; }
  .review-meta { font-size: 12.5px; color: var(--grey); }

  .empty-state {
    background: #fffaf0;
    border: 1px dashed var(--gold-600);
    border-radius: 16px;
    padding: 26px 20px;
    text-align: center;
  }
  .empty-state p {
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--navy-900);
    line-height: 1.5;
  }
  .empty-state .btn-primary {
    background: var(--navy-800);
    color: #fff;
  }

  .gallery-teaser {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    color: var(--grey);
    font-size: 13.5px;
  }

  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    line-height: 1.6;
  }
  footer a { color: #fbd97a; text-decoration: none; font-weight: 600; }

  .icon { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="page">

  <div class="brand-tag" id="brandTag">Trustmore</div>

  <div class="hero">
    <div class="avatar" id="avatar"><!-- iniciais ou foto via JS --></div>
    <h1 id="providerName">Karen Viana</h1>
    <p class="service" id="providerService">Limpezas em geral</p>
    <p class="region" id="providerRegion">Amsterdam e cidades vizinhas</p>

    <div id="ratingBadge"></div>

    <div class="cta-row">
      <a class="btn btn-primary" id="ctaContact" href="#" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.29-1.39a9.9 9.9 0 0 0 4.7 1.2h.01c5.46 0 9.91-4.45 9.91-9.9 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 1.67c2.2 0 4.26.86 5.82 2.42a8.2 8.2 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23a8.3 8.3 0 0 1-4.2-1.15l-.3-.18-3.14.82.84-3.06-.2-.32a8.18 8.18 0 0 1-1.26-4.37c0-4.54 3.7-8.23 8.24-8.23h.03Zm-3.06 4.2c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.03s.87 2.36.99 2.52c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.43-.58 1.63-1.15.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.55.12-.16.24-.63.78-.77.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.35-.76-1.84-.2-.48-.4-.42-.55-.42h-.47Z"/></svg>
        Chamar no WhatsApp
      </a>
      <a class="btn btn-ghost" id="ctaReview" href="#" target="_blank" rel="noopener">
        ★ Deixar avaliação
      </a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Avaliações de clientes</div>
    <div id="reviewsContainer"></div>
  </div>

  <div class="section" id="gallerySection" style="display:none;">
    <div class="section-title">Fotos do trabalho</div>
    <div class="gallery-teaser">Em breve: fotos de antes/depois dos serviços.</div>
  </div>

  <footer>
    Página pessoal de avaliações de Karen Viana.<br>
    <span id="footerBrand">Feito com carinho para clientes de confiança 💛</span>
  </footer>

</div>

<script>
  // ------------------------------------------------------------------
  // CONFIGURAÇÃO — edite só aqui para atualizar a página
  // (nome, serviço, cidade, WhatsApp, foto e avaliações)
  // ------------------------------------------------------------------
  const CONFIG = {
    brandName: "Trustmore", // nome do produto, aparece no topo da página
    name: "Karen Viana",
    service: "Limpezas em geral",
    region: "Amsterdam e cidades vizinhas",
    whatsapp: "31684661615", // formato: código do país + número, sem espaços, sem +
    photoUrl: "karen-foto.jpg", // troque o arquivo (mesmo nome) para atualizar a foto
    reviews: [
      // Exemplo de como adicionar uma avaliação real no futuro:
      // { name: "Fernanda", rating: 5, text: "A Karen é super caprichosa, recomendo demais!", date: "ago/2026" },
    ],
  };

  const contactMsg = `Olá ${CONFIG.name.split(" ")[0]}! Vi seu portfólio de avaliações e gostaria de saber mais sobre seus serviços de limpeza 😊`;
  const reviewMsg = `Olá ${CONFIG.name.split(" ")[0]}! Quero deixar uma avaliação sobre o seu serviço 💛\n\n⭐ Nota (1 a 5):\n📝 Comentário:\n🙋 Meu nome:`;

  document.getElementById("brandTag").textContent = CONFIG.brandName;
  document.getElementById("providerName").textContent = CONFIG.name;
  document.getElementById("providerService").textContent = CONFIG.service;
  document.getElementById("providerRegion").textContent = CONFIG.region;
  document.title = `${CONFIG.name} · ${CONFIG.service} · ${CONFIG.brandName}`;

  document.getElementById("ctaContact").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(contactMsg)}`;
  document.getElementById("ctaReview").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(reviewMsg)}`;

  // Avatar: foto real se existir, senão iniciais
  const avatarEl = document.getElementById("avatar");
  if (CONFIG.photoUrl) {
    avatarEl.style.backgroundImage = `url(${CONFIG.photoUrl})`;
    avatarEl.style.backgroundSize = "cover";
    avatarEl.style.backgroundPosition = "center";
  } else {
    const initials = CONFIG.name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
    avatarEl.textContent = initials;
  }

  // Badge de nota média (só aparece se houver avaliações)
  const ratingBadgeEl = document.getElementById("ratingBadge");
  if (CONFIG.reviews.length > 0) {
    const avg = (CONFIG.reviews.reduce((s, r) => s + r.rating, 0) / CONFIG.reviews.length).toFixed(1);
    ratingBadgeEl.innerHTML = `<div class="rating-badge">★ ${avg} · ${CONFIG.reviews.length} avaliação${CONFIG.reviews.length > 1 ? "ões" : ""}</div>`;
  }

  // Lista de avaliações ou estado vazio
  const reviewsContainer = document.getElementById("reviewsContainer");
  if (CONFIG.reviews.length === 0) {
    reviewsContainer.innerHTML = `
      <div class="empty-state">
        <p>Ainda não há avaliações públicas por aqui.<br>Seja a primeira pessoa a avaliar o trabalho da ${CONFIG.name.split(" ")[0]}!</p>
        <a class="btn btn-primary" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(reviewMsg)}" target="_blank" rel="noopener">★ Deixar avaliação</a>
      </div>`;
  } else {
    reviewsContainer.innerHTML = CONFIG.reviews.map(r => `
      <div class="review-card">
        <div class="review-stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div>
        <p class="review-text">"${r.text}"</p>
        <div class="review-meta">${r.name} · ${r.date}</div>
      </div>
    `).join("");
  }
</script>

</body>
</html>
